name: Deploy to cPanel

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install

      - name: Install & build frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Package build for deploy
        run: |
          tar --exclude='.git' --exclude='.github' \
              --exclude='frontend/node_modules' --exclude='backend/node_modules' \
              --exclude='node_modules' \
              -czf deploy.tar.gz .

      - name: Copy archive to server
        run: |
          scp -P ${{ secrets.SSH_PORT }} deploy.tar.gz \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.APP_PATH }}/deploy.tar.gz

      - name: Extract on server, install deps & restart app
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd ${{ secrets.APP_PATH }} &&
            tar -xzf deploy.tar.gz &&
            rm deploy.tar.gz &&
            source /home/${{ secrets.SSH_USER }}/nodevenv/nodeapp/18/bin/activate &&
            cd backend && npm install --production &&
            cd .. && mkdir -p tmp && touch tmp/restart.txt
          "